{% extends "base.html" %}
{% load static %}
{% block title %}Главная{% endblock title %}
{% block content %}

<h1>НАСТОЛЬНЫЕ ИГРЫ <span class="wood-text">ИЗ ДЕРЕВА</span></h1>
<div class="main-container">
  <!-- Правое фото наверху -->
  <div class="right-element">
    <img src="media/photo/photo2.svg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <!-- Контейнер для левого элемента и иконок -->
  <div class="left-and-icons-container">
    <!-- Левое фото -->
    <div class="left-element">
      <img src="media/photo/photo1.jpg" alt="" style="width: 50%; border-radius: 31px;">
    </div>

    <!-- Три иконки справа -->
<div class="bottom-container">
    <a href="{% url 'landing' %}" id="submit">
        <div class="bottom-element">
            <p1>ОФОРМИТЬ ЗАКАЗ</p1>
        </div>
    </a>
    <a href="{% url 'landing' %}" id="about">
        <div class="bottom-element">
            <p2>О НАС</p2>
        </div>
    </a>
    <a href="{% url 'landing' %}" id="delivery">
        <div class="bottom-element">
            <p1>ДОСТАВКА</p1>
        </div>
    </a>
</div>





{% endblock %}
